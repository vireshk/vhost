[workspace]
resolver = "2"

members = [
    "vhost",
    "vhost-user-backend",
    "vhost-user-frontend",
]

[patch.crates-io]
virtio-queue = { path = "../vm-virtio/virtio-queue" }
vm-memory = { path = "../vm-memory" }

[workspace.dependencies]
virtio-bindings = "0.2.6"
